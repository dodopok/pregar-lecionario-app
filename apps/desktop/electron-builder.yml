# Empacotamento do Proper para macOS, Windows e Linux.
# Todo o código (inclusive dependências) é empacotado pelo electron-vite em out/; o instalador não leva node_modules.
appId: br.caminhoanglicano.proper
productName: Proper
copyright: Copyright © 2026 Caminho Anglicano
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# CMaps do PDF.js para o indexador (processo utilitário lê do disco; PDFs CJK sem fonte embutida).
extraResources:
  - from: ../../node_modules/pdfjs-dist/cmaps
    to: pdfjs-cmaps
    filter: ['*.bcmap']
npmRebuild: false
electronLanguages: [pt-BR, pt-PT, en-US]
protocols: []
publish:
  provider: github
  owner: dodopok
  repo: pregar-lecionario-app
  releaseType: draft

mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # A notarização usa APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID (ou APPLE_API_KEY) quando presentes.
  notarize: true
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Caminho Anglicano
dmg:
  artifactName: Proper-${version}-mac.${ext}
  title: Proper ${version}
  # APFS e lzfse: a imagem HFS+/zlib gerada no macOS 26 deu erro de leitura (-36) ao copiar o app.
  # Os dois são lidos por qualquer macOS a partir do 10.13; o mínimo do app é o 12.
  filesystem: APFS
  format: ULFO

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  # Assinatura: CSC_LINK/CSC_KEY_PASSWORD (certificado) ou azureSignOptions via variáveis do Azure Trusted Signing.
  artifactName: Proper-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Proper
  uninstallDisplayName: Proper
  installerLanguages: [pt_BR, en_US]
  language: '1046'

linux:
  executableName: proper
  syncDesktopName: true
  icon: resources/icons
  category: Office
  synopsis: Preparação de sermões com o lecionário
  description: Calendário litúrgico, leituras, editor, biblioteca de comentários e revisão por IA para quem prega.
  maintainer: Caminho Anglicano <contato@caminhoanglicano.com.br>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: Proper-${version}-${arch}.${ext}
