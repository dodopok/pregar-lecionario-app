name: Pregar
options:
  bundleIdPrefix: br.caminhoanglicano
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Pregar:
    type: application
    platform: macOS
    sources:
      - path: Pregar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.caminhoanglicano.pregar
        PRODUCT_NAME: Pregar
        INFOPLIST_KEY_CFBundleDisplayName: Pregar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
        # Stable app identity keeps Keychain trust across local rebuilds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: R573HPN65Q
  PregarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PregarTests
    dependencies:
      - target: Pregar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.caminhoanglicano.pregar.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pregar.app/Contents/MacOS/Pregar
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: R573HPN65Q
