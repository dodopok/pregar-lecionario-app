name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes, tipos e lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pregar
          POSTGRES_PASSWORD: pregar
          POSTGRES_DB: pregar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pregar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pregar:pregar@127.0.0.1:5432/pregar_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  desktop-e2e:
    name: App desktop (Linux, ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build
        run: npm run build -w @pregar/desktop
      - name: Smoke e Mesa
        working-directory: apps/desktop
        run: |
          xvfb-run -a node test/e2e/smoke.mjs out smoke.png
          xvfb-run -a node test/e2e/mesa.mjs out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-desktop
          path: |
            apps/desktop/screenshots
            apps/desktop/*.png
          if-no-files-found: ignore

  api-image:
    name: Imagem Docker da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: pregar-api:ci
