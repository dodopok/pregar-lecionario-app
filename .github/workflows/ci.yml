name: CI

# Desligado nos envios: o GitHub Actions não está disponível nesta conta. A verificação oficial é
# local, com `npm run verify` na raiz. Para religar, troque o gatilho por:
#   push: { branches: [main, 'feat/**'] }
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes, tipos e lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pregar
          POSTGRES_PASSWORD: pregar
          POSTGRES_DB: pregar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pregar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pregar:pregar@127.0.0.1:5432/pregar_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  desktop-e2e:
    name: App desktop (Linux, ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build
        run: npm run build -w @pregar/desktop
      - name: Roteiros ponta a ponta (Mesa, Preferências, Leitor, Biblioteca)
        working-directory: apps/desktop
        run: xvfb-run -a node test/e2e/run-all.mjs out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-desktop
          path: apps/desktop/screenshots
          if-no-files-found: ignore

  desktop-os:
    name: App desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes de domínio, editor e app
        run: npx vitest run --project core --project editor --project desktop
      - name: Build
        run: npm run build -w @pregar/desktop
      - name: Roteiros ponta a ponta
        working-directory: apps/desktop
        run: node test/e2e/run-all.mjs out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-desktop-${{ matrix.os }}
          path: apps/desktop/screenshots
          if-no-files-found: ignore

  api-image:
    name: Imagem Docker da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: pregar-api:ci
